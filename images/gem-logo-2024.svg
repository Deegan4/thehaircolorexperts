<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <style>
    .text { font-family: 'Arial', sans-serif; font-weight: bold; fill: white; }
    .mountain { fill: white; }
    .background { fill: #2a3c5a; }
    .tagline { font-family: 'Arial', sans-serif; font-style: italic; fill: white; font-size: 24px; }
  </style>
  <rect class="background" x="0" y="0" width="500" height="500" rx="10" fill="#2a3c5a" />
  
  <!-- Mountain Logo -->
  <path class="mountain" d="M250,100 L350,300 H150 Z" />
  <path class="mountain" d="M220,150 L180,250 L200,220 L220,250 L240,200 Z" />
  
  <!-- Text -->
  <text class="text" x="120" y="80" font-size="24" text-anchor="middle">EST.</text>
  <text class="text" x="380" y="80" font-size="24" text-anchor="middle">2024</text>
  
  <!-- Company Name -->
  <text class="text" x="250" y="370" font-size="42" text-anchor="middle">GLACIERS EDGE MEDIA</text>
  
  <!-- Tagline -->
  <text class="tagline" x="250" y="420" text-anchor="middle">Scaling your business</text>
</svg> 